name: Update CloudflareSpeedTest CSV

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CloudflareSpeedTest
        run: |
          chmod +x ./cfst
          ./cfst -tl 200 -dn 20 -o result-full.csv
          head -n 21 result-full.csv > result.csv
          rm result-full.csv

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f result.csv ]; then
            echo "result.csv 未生成，跳过提交"
            exit 0
          fi
          git add result.csv
          if git diff --cached --quiet; then
            echo "result.csv 没有变化，跳过提交"
            exit 0
          fi
          git commit -m "Auto-update result.csv"
          git push

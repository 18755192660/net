name: Update CloudflareSpeedTest CSV

on:
  schedule:
    - cron: '0 16 * * *'   
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CloudflareSpeedTest
        run: |
          chmod +x ./cfst
          ./cfst -dn 20 -o result.csv

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update result.csv"
          git push
